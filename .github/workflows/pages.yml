# VaporとLeafで作ったページを静的なHTMLに書き出し、GitHub Pagesに公開する
#
# リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にしておくこと
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 公開は1つずつ行う（実行中の公開は取り消さない）
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-swift-6.4-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.4-

      - name: Test
        run: swift test

      # 元サイトと同じく、App Storeの価格はこのときに取得する
      # プロジェクトサイトは https://<ユーザー>.github.io/<リポジトリ名>/ に公開されるため、リポジトリ名を公開パスにする
      # テストでビルドしたデバッグ版をそのまま使う（リリースビルドより短時間で済む）
      - name: Export static site
        run: swift run SwiftVaporTestPage export --output dist
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
